<!-- utilisateur-form.component.html -->
<h2 class="text-xl font-bold mb-4">{{ modeEdition ? 'Modifier un utilisateur' : 'Ajouter un utilisateur' }}</h2>

<form (ngSubmit)="enregistrer()" class="space-y-4 max-w-md">
  <div>
    <label class="block text-sm font-medium">Nom</label>
    <input [(ngModel)]="utilisateur.nom" name="nom" required class="w-full px-3 py-2 border rounded" />
  </div>

  <div>
    <label class="block text-sm font-medium">Prénom</label>
    <input [(ngModel)]="utilisateur.prenom" name="prenom" required class="w-full px-3 py-2 border rounded" />
  </div>

  <div>
    <label class="block text-sm font-medium">Rôle</label>
    <select [(ngModel)]="utilisateur.role" name="role" required class="w-full px-3 py-2 border rounded">
      <option value="">-- Sélectionner --</option>
      <option value="Administrateur">Administrateur</option>
      <option value="Enseignant">Enseignant</option>
      <option value="Tuteur">Tuteur</option>
      <option value="Technopédagogue">Technopédagogue</option>
    </select>
  </div>

  <div>
    <label class="block text-sm font-medium">Profil</label>
    <input [(ngModel)]="utilisateur.profil" name="profil" required class="w-full px-3 py-2 border rounded" />
  </div>

  <div>
    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
      {{ modeEdition ? 'Enregistrer les modifications' : 'Ajouter' }}
    </button>
  </div>
</form>
